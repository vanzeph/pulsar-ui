name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install:
    name: pip installability smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from source (non-editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Smoke import and entry point of the service package
        run: |
          python -c "import pulsar_ui; print('install ok', pulsar_ui.__version__)"
          python -c "from pulsar_ui.server import create_app; app = create_app(); print('app ok', len(app.routes), 'routes')"

  tests:
    name: pytest suite (hosted web dashboard, read-only surface, loopback bind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with test extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests (serves and inspects the committed web build output)
        run: python -m pytest -v

  web:
    name: web dashboard build (reproducibility gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web dashboard from source (zero TS errors required)
        run: tools/build_web.sh

      - name: Built output matches what the package hosts
        run: |
          test -f src/pulsar_ui/static/index.html
          test -n "$(find src/pulsar_ui/static/assets -name '*.js')"
          grep -q 'id="root"' src/pulsar_ui/static/index.html

  topology-gate:
    name: cross-repo topology gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch topology gate tool (versioned reference)
        run: |
          git clone --quiet https://github.com/vanzeph/pulsar-contracts.git /tmp/pulsar-contracts
          git -C /tmp/pulsar-contracts checkout --quiet 4178b2ee27757b858922d26b7e1a532acf953e7e

      - name: Topology check (pulsar-ui must depend on no pulsar package)
        run: python /tmp/pulsar-contracts/tools/check_topology.py --repo "$GITHUB_WORKSPACE"
