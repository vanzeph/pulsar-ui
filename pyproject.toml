[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulsar-ui"
version = "0.1.0"
description = "Pulsar local visualization dashboard: FastAPI read-only query service over run artifacts and the data lake (format-contract consumer, zero pulsar package dependencies)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "vanzeph" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "duckdb>=1.0,<2",
    "pytz>=2024.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
    "pyarrow>=15",
]

[project.scripts]
pulsar-ui = "pulsar_ui.server:main"

[project.urls]
Repository = "https://github.com/vanzeph/pulsar-ui"

[tool.hatch.build.targets.wheel]
packages = ["src/pulsar_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
